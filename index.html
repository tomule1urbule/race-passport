<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race Passport</title>
<meta name="description" content="Your personal map and log of every race you've run.">
<meta name="theme-color" content="#0c1322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Race Passport">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f3efe6;--card:#fffdf7;--card2:#f8f3e8;--ink:#14213d;--muted:#6b6f7b;--line:#e2d9c6;
  --accent:#e4572e;--accent-ink:#fff;--good:#1f9d63;--bad:#c2410c;--gold:#c8961e;
  --land:#ddd4c0;--land-line:#cbbfa6;--ocean:#dfe8ea;--visited:#e4572e;
  --lock-bg:#ece5d5;--lock-line:#c7bba2;--lock-ink:#a99c82;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.07);
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --page:repeating-radial-gradient(circle at 20% 30%,transparent 0 10px,rgba(20,33,61,.035) 10px 11px),var(--card);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322;--card:#141e35;--card2:#18243f;--ink:#f2ede2;--muted:#93a0b8;--line:#243252;
  --accent:#ff6b3d;--accent-ink:#1a0d06;--good:#3ccf8e;--bad:#ff8a5c;--gold:#f0c04a;
  --land:#1d2a47;--land-line:#2c3b5f;--ocean:#0e1729;--visited:#ff6b3d;
  --lock-bg:#1a2642;--lock-line:#33456d;--lock-ink:#4b5f88;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --page:repeating-radial-gradient(circle at 20% 30%,transparent 0 10px,rgba(255,255,255,.03) 10px 11px),var(--card);
}}
:root[data-theme="dark"]{
  --bg:#0c1322;--card:#141e35;--card2:#18243f;--ink:#f2ede2;--muted:#93a0b8;--line:#243252;
  --accent:#ff6b3d;--accent-ink:#1a0d06;--good:#3ccf8e;--bad:#ff8a5c;--gold:#f0c04a;
  --land:#1d2a47;--land-line:#2c3b5f;--ocean:#0e1729;--visited:#ff6b3d;
  --lock-bg:#1a2642;--lock-line:#33456d;--lock-ink:#4b5f88;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --page:repeating-radial-gradient(circle at 20% 30%,transparent 0 10px,rgba(255,255,255,.03) 10px 11px),var(--card);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:1500;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.crest{width:38px;height:38px;color:var(--accent);flex:none}
.brand h1{margin:0;font-family:var(--num);font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding:16px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--num);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--muted);margin:24px 2px 10px}
.sec-title button{background:none;border:0;color:var(--accent);font:inherit;letter-spacing:.1em;padding:8px 0 8px 12px}
.banner{background:var(--bad);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:600}
.crown{width:1.05em;height:.9em;vertical-align:-.08em;display:inline-block}
/* map */
#mapwrap{position:relative;overflow:hidden;padding:0;isolation:isolate}
#map{height:min(62vh,520px);background:var(--ocean);border-radius:18px}
.leaflet-container{background:var(--ocean);font-family:var(--body)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;width:38px!important;height:38px!important;line-height:38px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--muted)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px;min-width:230px;max-width:280px;max-height:360px;overflow:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);width:32px;height:32px;font-size:22px}
.pin2{position:relative;width:40px;height:50px}
.pin2 .bub{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center;font-size:20px;line-height:1}
.pin2::after{content:'';position:absolute;left:14px;top:35px;border:6px solid transparent;border-top:10px solid var(--accent)}
.pin2.up .bub{border-style:dashed;border-color:#8a93a6}.pin2.up::after{border-top-color:#8a93a6}
.pin2 .cnt{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--bg);font:800 13px/20px var(--num);text-align:center}
.pin2 .pbm{position:absolute;left:-7px;top:-8px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#fff0a8,#e9b530 50%,#a26f0c);color:#4a3000;display:grid;place-items:center;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mapchips{position:absolute;right:10px;top:10px;z-index:900;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.chipstat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:700 15px var(--num);letter-spacing:.04em;box-shadow:var(--shadow)}
.chipstat span{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.1em;margin-left:4px}
.mapnote{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);z-index:800;pointer-events:none}
.pop-head{font:800 18px var(--num);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.pop-race{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.pop-race:first-of-type{border-top:0;padding-top:0}
.pop-race .st{width:64px;height:64px;flex:none}
.pop-race .tx{flex:1;min-width:0}
.pop-race h4{margin:0;font-size:14px;line-height:1.2}
.pop-race p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.pop-race .t{font:700 18px var(--num);color:var(--ink)}
.pop-photo{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px;display:block}
.pop-btn{margin:8px 0 4px;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:14px;color:var(--ink)}
/* countdown */
.countdown{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:14px;width:100%;text-align:left}
.countdown .st{width:80px;height:80px;flex:none}
.countdown .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.countdown h3{margin:2px 0 4px;font-size:17px;line-height:1.2}
.cd-digits{display:flex;gap:12px}
.cd-digits div{font:800 30px/1 var(--num);min-width:34px}
.cd-digits small{display:block;font:600 10px var(--body);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:2px}
/* passport page */
.ppage{background:var(--page);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ppage button{background:none;border:0;padding:0;border-radius:12px;aspect-ratio:1}
.ppage button:active{transform:scale(.96)}
.ppage .st{width:100%;height:100%}
/* list */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar select,.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%;font-size:16px}
.toolbar select{width:auto;flex:1;min-width:120px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:700 15px var(--num);letter-spacing:.06em;text-transform:uppercase}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.race{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.race:active{transform:scale(.99)}
.race .st{width:76px;height:76px;flex:none}
.race .mid{flex:1;min-width:0}
.race h3{margin:0;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race .meta{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font:700 12px var(--num);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.tag.pb{background:linear-gradient(135deg,#fff0a8,#e9b530 55%,#b07c10);color:#3f2a00;border-color:#b07c10;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tag.up{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.goal{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.tag.faster{color:var(--good)}.tag.slower{color:var(--bad)}
.race .right{text-align:right;flex:none}
.race .time{font:800 26px/1 var(--num);letter-spacing:.02em}
.race .pace{font-size:12px;color:var(--muted);margin-top:4px}
.yearhead{font:800 22px var(--num);letter-spacing:.08em;margin:18px 4px 8px;color:var(--muted)}
.empty{text-align:center;padding:36px 20px}
.empty .big{width:110px;height:110px;margin:0 auto 12px;color:var(--accent)}
.empty h2{font-family:var(--num);font-size:28px;letter-spacing:.05em;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 16px}
/* stats */
.bignums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.bignums{grid-template-columns:repeat(4,1fr)}}
.bignum{padding:14px 16px}
.bignum b{display:block;font:800 52px/0.95 var(--num);letter-spacing:.01em}
.bignum span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pbcard{padding:14px 16px;text-align:left;width:100%;position:relative}
.pbcard .d{font:800 15px var(--num);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.pbcard .t{font:800 38px/1.05 var(--num)}
.pbcard .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbcard .cr{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fff0a8,#e9b530 55%,#a26f0c);color:#4a3000;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pbcard.none .t{color:var(--line)}
.bars{padding:14px 16px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar .y{width:44px;font:700 17px var(--num)}
.bar .track{flex:1;height:22px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .n{width:28px;text-align:right;font:800 18px var(--num)}
.conts{display:flex;gap:6px;flex-wrap:wrap}
.conts .chip{min-height:34px;display:inline-flex;align-items:center;cursor:default}
/* badges */
.bhead{display:flex;align-items:center;gap:8px;font:800 14px var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.bhead i{flex:1;height:1px;background:var(--line)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:560px){.bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bcard{padding:12px 8px 10px;text-align:center;width:100%;display:flex;flex-direction:column;align-items:center}
.bcard .em{width:74px;height:74px;display:block;margin-bottom:6px}
.bcard .em svg{width:100%;height:100%}
.bcard h5{margin:0;font:800 clamp(12.5px,3.7vw,15px)/1.1 var(--num);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:break-word;max-width:100%}
.bcard p{margin:3px 0 0;font-size:11px;color:var(--muted);line-height:1.3}
.bcard .when{margin-top:5px;font:700 11px var(--num);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.bcard.locked h5{color:var(--muted)}
.bcard .prog{width:100%;height:5px;border-radius:3px;background:var(--card2);margin-top:7px;overflow:hidden}
.bcard .prog i{display:block;height:100%;background:var(--muted);border-radius:3px}
.bcard .pt{font:700 11px var(--num);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.bsummary{display:flex;align-items:center;gap:14px;padding:14px 16px}
.bsummary b{font:800 44px/1 var(--num)}
.bsummary .track{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bsummary .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.unlock{text-align:center;padding:6px 0 4px}
.unlock .lbl{font:800 16px var(--num);letter-spacing:.3em;color:var(--accent)}
.unlock .stage{position:relative;width:230px;height:230px;margin:6px auto 4px;display:grid;place-items:center}
.unlock .rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 35%,transparent) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 14s linear infinite}
.unlock .m{width:160px;height:160px;position:relative;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.unlock .m svg{width:100%;height:100%}
.unlock p{color:var(--muted);margin:4px 0 14px}
.unlock .more{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.unlock .more span{width:46px;height:46px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
/* buttons/settings */
.btn{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.settings{padding:14px 16px;display:grid;gap:12px}
.filetap{position:relative;overflow:hidden}
.filetap input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:1600;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:72px}
.tab{background:none;border:0;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:700 12px var(--num);letter-spacing:.14em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--accent)}
.fab{width:64px;height:64px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:30px;height:30px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:3000;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out;position:relative}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.sheethead h2{font-family:var(--num);font-size:28px;letter-spacing:.05em;margin:0;text-transform:uppercase}
.closebtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.closebtn svg{width:18px;height:18px}
.field{display:block;margin-bottom:12px}
.field>span,.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 2px 5px}
.field textarea{padding:10px 12px;min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar select:focus{outline:2px solid var(--accent);outline-offset:1px}
.timein{font:700 22px var(--num)!important;letter-spacing:.06em}
.distpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.distpick button{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:800 18px var(--num);letter-spacing:.06em;text-transform:uppercase}
.distpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:-6px 2px 12px}
.livepace{font:700 15px var(--num);letter-spacing:.06em;color:var(--accent);margin:-4px 2px 12px;min-height:18px}
/* combobox */
.combo{position:relative}
.combo input{padding-right:38px!important}
.combo .chev{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.combo .chev svg{width:18px;height:18px}
.cpanel{position:absolute;top:calc(100% + 4px);left:0;width:max(100%,270px);max-height:290px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:30;display:none;overscroll-behavior:contain}
.combo.right .cpanel{left:auto;right:0}
.cpanel.on{display:block}
.copt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;min-height:46px;font-size:15px}
.copt:last-child{border-bottom:0}
.copt.hl{background:var(--card2)}
.copt .fl{font-size:20px;width:26px;text-align:center;flex:none}

function makeCombo(wrap, { items, onPick, onType }) {

  const close = () => { open = false; panel.classList.remove('on'); };
  const draw = async () => {
    const my = ++token, res = await items(input.value.trim());
    if (my !== token) return;

    current = current.filter(x => !x.empty);

  input.addEventListener('input', () => { onType && onType(input.value); draw(); });
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { if (open && current[0] && input.value.trim()) { e.preventDefault(); e.stopPropagation(); onPick(current[0]); close(); } }
    else if (e.key === 'Escape') close();

  for (let k = 0; k < 26; k++) { x.beginPath(); for (let i = 0; i <= W; i += 8) { const y = 120 + k * 70 + Math.sin(i / 60 + k) * 26 + Math.sin(i / 23 + k * 2) * 8; i ? x.lineTo(i, y) : x.moveTo(i, y); } x.stroke(); }
  x.textAlign = 'center';
  x.fillStyle = P.muted; x.font = `600 26px ${N}`; ls(10); x.fillText('PASSPORT · PASSEPORT · PASAS', W / 2, 150);
  x.fillStyle = P.ink; x.font = `800 128px ${N}`; ls(6); x.fillText('RACE PASSPORT', W / 2, 280, W - 80);
  x.fillStyle = P.acc; x.font = `700 36px ${N}`; ls(4); x.fillText((ui.owner || 'RUNNER').toUpperCase() + ' · ' + new Date().getFullYear(), W / 2, 335);
  const mx = 40, my = 390, mw = 1000, latTop = 80, latBot = -58, mh = mw * (latTop - latBot) / 360;
  const proj = (lng, lat) => [mx + (lng + 180) / 360 * mw, my + (latTop - lat) / (latTop - latBot) * mh];
  x.save(); x.beginPath(); if (x.roundRect) x.roundRect(mx - 10, my - 10, mw + 20, mh + 20, 24); else x.rect(mx - 10, my - 10, mw + 20, mh + 20); x.clip();
  if (COUNTRIES) for (const [code, polys] of Object.entries(COUNTRIES)) {
    x.beginPath();
    for (const poly of polys) for (const ring of poly) ring.forEach(([lng, lat], i) => { const [px, py] = proj(lng, lat); i ? x.lineTo(px, py) : x.moveTo(px, py); });
    const v = st.countries.has(code);

  } else { x.fillStyle = P.muted; x.font = '500 30px Inter, sans-serif'; ls(0); x.fillText('map unavailable offline', W / 2, my + mh / 2); }
  for (const r of done()) if (r.lat != null) { const [px, py] = proj(r.lng, r.lat); x.beginPath(); x.arc(px, py, 9, 0, 7); x.fillStyle = P.ink; x.fill(); x.lineWidth = 4; x.strokeStyle = P.acc; x.stroke(); }
  x.restore();
  const nums = [[st.races, 'RACES'], [st.countries.size, 'COUNTRIES'], [st.cities.size, 'CITIES'], [fmtKm(st.km), 'KM RACED']];
  let y0 = my + mh + 60;
  nums.forEach(([v, l], i) => {
    const cx = 60 + (i % 2) * 500, cy = y0 + Math.floor(i / 2) * 200;

    x.fillStyle = P.muted; x.font = `700 30px ${N}`; ls(8); x.fillText(l, cx + 6, cy + 176);
  });
  y0 += 440;
  x.strokeStyle = P.line; x.lineWidth = 2; x.beginPath(); x.moveTo(60, y0); x.lineTo(W - 60, y0); x.stroke();
  x.fillStyle = P.gold; x.font = `700 30px ${N}`; ls(8); x.fillText('PERSONAL BESTS', 60, y0 + 54);
  ['5K', '10K', 'HM', 'M'].forEach((k, i) => {
    const cx = 60 + i * 245, r = st.pbs[k];
    x.fillStyle = P.muted; x.font = `700 28px ${N}`; ls(5); x.fillText(DIST[k].label.toUpperCase(), cx, y0 + 104);
    x.fillStyle = r ? P.ink : P.line; x.font = `800 ${r && r.time >= 3600 ? 58 : 66}px ${N}`; ls(0); x.fillText(r ? fmtTime(r.time) : '--', cx, y0 + 166);

  if (withStamps) {

    const n = imgs.length;

const canvasBlob = c => new Promise((res, rej) => { try { c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'); } catch (e) { rej(e); } });
async function openShare() {
  if (!done().length) { toast('Finish a race first — then your card has something to show'); return; }
  openSheet('Story card', `<img class="sharepreview" id="sharePrev" alt="Story card preview"><p class="muted" id="shareMsg" style="text-align:center;margin:0 0 12px">Drawing your passport…</p><div class="row"><button type="button" class="btn" id="dlBtn" disabled>Save image</button><button type="button" class="btn primary" id="shBtn" disabled>Share</button></div>`);
  let blob;
  try { blob = await canvasBlob(await makeCard(true)); }
  catch (e) { try { blob = await canvasBlob(await makeCard(false)); } catch (e2) { $('#shareMsg').textContent = 'This browser couldn’t draw the card.'; return; } }
  if (!$('#sharePrev')) return;
  shareURL = URL.createObjectURL(blob);
  $('#sharePrev').src = shareURL; $('#shareMsg').textContent = '1080 × 1920 · ready for Instagram stories';
  const file = new File([blob], 'race-passport.png', { type: 'image/png' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('#dlBtn').disabled = false; $('#dlBtn').onclick = () => saveFile(blob, 'race-passport.png');
  const sh = $('#shBtn'); sh.disabled = false;
  sh.onclick = canShare ? () => navigator.share({ files: [file], title: 'My Race Passport' }).catch(() => {}) : () => saveFile(blob, 'race-passport.png');
  if (!canShare) sh.textContent = 'Save to share';
}

/* ================= backup ================= */
async function exportBackup() {
  const data = JSON.stringify({ app: 'race-passport', v: 3, exported: new Date().toISOString(), owner: ui.owner, races, photos });
  if (await saveFile(new Blob([data], { type: 'application/json' }), `race-passport-${todayStr()}.json`)) toast('Backup saved');
}
function bindImport() {
  const i = $('#importBox input'); if (!i) return;
  i.onchange = async () => {
    const f = i.files && i.files[0]; if (!f) return; i.value = '';
    try {
      const j = JSON.parse(await f.text()); if (!Array.isArray(j.races)) throw 0;
      const ids = new Set(races.map(r => r.id)); let n = 0;
      for (const r of j.races) if (r && r.id && !ids.has(r.id) && DIST[r.dist] && !r.demo) { races.push(r); n++; }
      for (const [k, v] of Object.entries(j.photos || {})) if (races.some(r => r.id === k)) await savePhoto(k, v);
      if (j.owner && !ui.owner) { ui.owner = j.owner; store.set('rp.owner', ui.owner); }
      save(); mapFitted = false; renderAll(); fixMissingCoords(); toast(`Imported ${n} race${n === 1 ? '' : 's'}`);
    } catch (e) { toast('That file isn’t a Race Passport backup'); }
  };
}

/* ================= theme ================= */
const THEME_ICONS = { auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>', light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>' };
let booted = false;
function applyTheme() {
  if (ui.theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = ui.theme;
  $('#themeBtn').innerHTML = THEME_ICONS[ui.theme];
  $('#themeBtn').setAttribute('aria-label', 'Theme: ' + ui.theme);
  $('meta[name=theme-color]').content = cssVar('--bg') || '#0e1525';
  if (baseTiles) { baseTiles.setUrl(TILE_URL(isDark(), false)); labelTiles.setUrl(TILE_URL(isDark(), true)); }
  if (booted) renderAll();
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => ui.theme === 'auto' && applyTheme()); } catch (e) {}

/* ================= events ================= */
function showTab(t) {
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  if (t === 'map' && map) setTimeout(() => map.invalidateSize(), 60);
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', async e => {
  const bd = e.target.closest('[data-badge]'); if (bd) { openBadge(bd.dataset.badge); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { const o = e.target.closest('[data-open]'); if (o) openDetail(o.dataset.open); return; }
  const act = a.dataset.act, r = a.dataset.id ? races.find(x => x.id === a.dataset.id) : null;
  if (act === 'add') openForm();
  else if (act === 'close') closeSheet();
  else if (act === 'share') openShare();
  else if (act === 'export') exportBackup();
  else if (act === 'allraces') showTab('races');
  else if (act === 'install') {
    if (!installPrompt) { toast('Use Chrome’s ⋮ menu → Install app', 3500); return; }
    installPrompt.prompt(); const ch = await installPrompt.userChoice.catch(() => null); installPrompt = null; renderStats();
    if (ch && ch.outcome === 'accepted') toast('Installing Race Passport…');
  }
  else if (act === 'tostats') { closeSheet(); showTab('stats'); }
  else if (act === 'edit' && r) openForm(r);
  else if (act === 'del' && r) {
    $('#detailActions').outerHTML = `<div class="confirm" id="detailActions"><p>Delete “${esc(r.name)}”? This can’t be undone.</p><div class="row"><button type="button" class="btn" data-act="keep" data-id="${r.id}">Keep it</button><button type="button" class="btn danger" data-act="delyes" data-id="${r.id}">Delete</button></div></div>`;
  }
  else if (act === 'keep' && r) openDetail(r.id);
  else if (act === 'delyes' && r) { races = races.filter(x => x.id !== r.id); await deletePhoto(r.id); save(); closeSheet(); renderAll(); toast('Race deleted'); }
});
document.querySelectorAll('.tab[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('#shareTab').addEventListener('click', openShare);
$('#addBtn').addEventListener('click', () => openForm());
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.target.closest('.combo')) closeSheet(); });
$('#themeBtn').addEventListener('click', () => { ui.theme = { auto: 'light', light: 'dark', dark: 'auto' }[ui.theme]; store.set('rp.theme', ui.theme); applyTheme(); toast(ui.theme === 'auto' ? 'Theme: follows your phone' : 'Theme: ' + ui.theme); });
$('#sortSel').addEventListener('change', e => { ui.sort = e.target.value; ui.dir = ui.sort === 'date' ? -1 : 1; renderList(); });
$('#dirBtn').addEventListener('click', () => { ui.dir *= -1; renderList(); });
$('#yearSel').addEventListener('change', e => { ui.year = e.target.value; renderList(); });
$('#distChips').addEventListener('click', e => { const c = e.target.closest('[data-dist]'); if (c) { ui.dist = c.dataset.dist; renderList(); } });
document.addEventListener('change', e => { if (e.target.id === 'ownerIn') { ui.owner = e.target.value.trim(); store.set('rp.owner', ui.owner); $('#ownerLine').textContent = ui.owner ? ui.owner + ' · Runner’s passport' : 'Runner’s passport'; } });
setInterval(() => { if ($('#v-map').classList.contains('on')) renderCountdown(); }, 1000);

/* ================= install & offline ================= */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (booted) renderStats(); });
window.addEventListener('appinstalled', () => { installPrompt = null; if (booted) renderStats(); toast('Race Passport installed — find it on your home screen', 3500); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} });
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

/* ================= boot ================= */
(async function boot() {
  const before = races.length;
  races = races.filter(r => r && r.id && DIST[r.dist] && !r.demo);
  if (races.length !== before) store.set('rp.races', races);
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (CAN_STORE && framed) $('#storageBanner').innerHTML = '<div class="banner" style="background:var(--card2);color:var(--ink);border:1px solid var(--line)">You’re in a preview window. If photos or downloads don’t work here, open your GitHub Pages link.</div>';
  if (!CAN_STORE) $('#storageBanner').innerHTML = '<div class="banner">This preview can’t save anything. Open Race Passport from its own web address (your GitHub Pages link) so your races and photos are kept.</div>';
  applyTheme();
  initMap();
  loadCountries().then(() => renderAll());
  renderAll();
  booted = true;
  photos = await loadPhotos();
  for (const id of Object.keys(photos)) if (!races.some(r => r.id === id)) deletePhoto(id);
  VER++; renderAll();
})();
